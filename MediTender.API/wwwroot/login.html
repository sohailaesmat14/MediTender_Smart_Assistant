<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Login</title>
    <script src="config.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 30px; color: #111827; }
        .logo span { color: #10b981; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .login-btn { background-color: #2563eb; color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-btn:hover { background-color: #1d4ed8; }
        .error-msg { color: #dc2626; font-size: 14px; margin-bottom: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">MediProcure <span>AI</span> 🤖</div>
        <h2 style="color: #1e293b; margin-bottom: 10px;">Committee Login</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Please authenticate to access the evaluation system.</p>
        
        <div id="errorMsg" class="error-msg">Invalid credentials. Try again.</div>

        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button class="login-btn" onclick="performLogin()">Login</button>
    </div>

    <script>
        async function performLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('${CONFIG.API_BASE_URL}/api/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem("jwt_token", data.token);
                    window.location.replace("upload.html");
                } else {
                    errorMsg.style.display = "block";
                }
            } catch (error) {
                errorMsg.innerText = "Server connection error.";
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
