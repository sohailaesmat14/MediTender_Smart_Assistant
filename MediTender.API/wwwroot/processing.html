<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediProcure AI - Processing</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f8fafc; color: #333; height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #111827; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .avatar { background-color: #0ea5e9; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .user-details { line-height: 1.2; }
        .user-details strong { font-size: 14px; }
        .user-details small { font-size: 12px; color: #9ca3af; }
        .hospital-badge { background-color: #374151; padding: 8px 15px; border-radius: 20px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .logo { font-size: 20px; font-weight: bold; }
        .logo span { color: #10b981; }

        .loading-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .spinner-wrapper { position: relative; width: 100px; height: 100px; margin-bottom: 30px; }
        .spinner { width: 100%; height: 100%; border: 4px solid #e2e8f0; border-top-color: #10b981; border-radius: 50%; animation: spin 1.5s linear infinite; box-sizing: border-box; }
        .brain-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-size: 32px; color: #1e293b; margin-bottom: 10px; }
        p { font-size: 18px; color: #64748b; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="user-profile">
                <div class="avatar">SE</div>
                <div class="user-details"><strong>Eng. Suhaila</strong><br><small>Biomedical Tendering</small></div>
            </div>
            <div class="hospital-badge">🏥 Hospital</div>
        </div>
        <div class="logo">MediProcure <span>AI</span> 🤖</div>
    </header>

    <div class="loading-container">
        <div class="spinner-wrapper">
            <div class="spinner"></div>
            <div class="brain-icon">🧠</div>
        </div>
        <h2>AI Engine is Working...</h2>
        <p id="processStatus">Initializing RAG extraction pipeline...</p>
    </div>

    <script>
        window.addEventListener('beforeunload', function (e) {
            // This message might not be shown in modern browsers, 
            // but returning a string triggers the browser's default warning dialog.
            const confirmationMessage = 'Are you sure you want to leave? Your progress will be lost.';
            e.returnValue = confirmationMessage; 
            return confirmationMessage;
        });
        document.addEventListener("DOMContentLoaded", async () => {
            const standardFile = sessionStorage.getItem('meditender_standard_file');
            const vendorsRaw = sessionStorage.getItem('meditender_vendors');
            const statusText = document.getElementById('processStatus');

            if (!standardFile || !vendorsRaw) {
                statusText.innerText = "Error: Missing data from upload step.";
                statusText.style.color = "red";
                return;
            }

            const vendors = JSON.parse(vendorsRaw);

            try {
                // Step 1: Extract standard requirements using AI
                statusText.innerText = "Phase 1: Auto-extracting mandatory specifications from Tender Standard...";
                let extractRes = await fetch(`http://localhost:5172/api/Document/extract-standard?fileName=${encodeURIComponent(standardFile)}`);
                
                if (!extractRes.ok) {
                    let errorMsg = await extractRes.text();
                    throw new Error(`API Error: ${errorMsg}`);
                }
                
                let extractData = await extractRes.json();
                let requirements = extractData.requirements;

                if (!requirements || requirements.length === 0) {
                    throw new Error("AI could not find any requirements in the document.");
                }

                // Step 2: Run Multi-Vendor Comparison
                statusText.innerText = `Phase 2: Semantic matching and comparing ${vendors.length} vendors against requirements...`;
                let compareRes = await fetch('http://localhost:5172/api/Document/compare-vendors', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenderId: 1, requirements: requirements, vendorNames: vendors })
                });

                if (!compareRes.ok) {
                    let errorMsg = await compareRes.text();
                    throw new Error(`Comparison API Error: ${errorMsg}`);
                }
                
                let evaluations = await compareRes.json();

                // Save final analysis to sessionStorage for Dashboard
                sessionStorage.setItem('meditender_evaluations', JSON.stringify(evaluations));
                
                statusText.innerText = "Analysis Complete! Redirecting to Decision Matrix...";
                window.onbeforeunload = null;
                window.onpopstate = null; 
                window.location.replace('dashboard.html'); 
            } catch (err) {
                statusText.innerText = "System Error: " + err.message;
                statusText.style.color = "red";
                document.querySelector('.spinner').style.display = 'none';
            }
        });
    </script>
</body>
</html>
